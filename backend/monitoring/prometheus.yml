# Prometheus Configuration for SleepFM
# =====================================================

global:
  scrape_interval: 15s          # How frequently to scrape targets
  evaluation_interval: 15s      # How frequently to evaluate rules
  external_labels:
    monitor: 'sleepfm-monitor'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # ==========================================
  # Prometheus self-monitoring
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ==========================================
  # SleepFM Backend API
  # ==========================================
  - job_name: 'sleepfm-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    scheme: http

  # ==========================================
  # Redis Metrics
  # ==========================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  # ==========================================
  # PostgreSQL Metrics (if using postgres_exporter)
  # ==========================================
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   metrics_path: /metrics

  # ==========================================
  # Celery Worker Metrics
  # ==========================================
  - job_name: 'celery-worker'
    static_configs:
      - targets: ['celery-worker:9808']
    metrics_path: /metrics

  # ==========================================
  # Node Exporter (System Metrics)
  # ==========================================
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #   metrics_path: /metrics
